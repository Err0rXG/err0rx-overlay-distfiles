name: MovieBox-Tui Crate Distfiles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MovieBox-Tui version to process (e.g., 0.1.18). Leave empty to auto-detect missing releases."
        required: false
        type: string

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: mesamirh/MovieBox-Tui
  DISTFILES_REPO: Err0rXG/err0rx-overlay-distfiles
  MIN_VERSION: "v0.1.18"

jobs:
  crates:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gentoo Portage & pycargoebuild
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install portage 'pycargoebuild>=0.17.1'

          echo "Python version: $(python --version)"
          echo "Portage version: $(python -c 'import portage; print(portage.VERSION)')"
          echo "pycargoebuild version: $(pycargoebuild --version 2>&1 || true)"

      - name: Determine target releases
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISTFILES_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WORKDIR="${RUNNER_TEMP}/work"
          mkdir -p "${WORKDIR}"

          INPUT_VERSION="${{ inputs.version }}"

          if [[ -n "${INPUT_VERSION}" ]]; then
            INPUT_VERSION="${INPUT_VERSION#v}"
            REQUESTED_TAG="v${INPUT_VERSION}"

            HIGHEST=\((printf '%s\n%s\n' "\){REQUESTED_TAG}" "${MIN_VERSION}" | sort -V | tail -n1)

            if [[ "\({REQUESTED_TAG}" == "\){MIN_VERSION}" ]] || [[ "\({HIGHEST}" == "\){REQUESTED_TAG}" ]]; then
              echo "Manual version selected: ${REQUESTED_TAG}"
              echo "versions=\({REQUESTED_TAG}" >> "\){GITHUB_OUTPUT}"
              exit 0
            else
              echo "Error: Requested version (\({REQUESTED_TAG}) is lower than minimum threshold (\){MIN_VERSION})." >&2
              exit 1
            fi
          fi

          echo "Fetching upstream releases from ${UPSTREAM_REPO}..."
          gh api --paginate "repos/${UPSTREAM_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' |
            sort -V > "${WORKDIR}/upstream-all.txt"

          if ! grep -Fxq "\({MIN_VERSION}" "\){WORKDIR}/upstream-all.txt"; then
            echo "Error: Baseline version ${MIN_VERSION} not found upstream." >&2
            exit 1
          fi

          awk -v min="${MIN_VERSION}" '\(0 == min { found=1 } found' "\){WORKDIR}/upstream-all.txt" \
            > "${WORKDIR}/upstream-eligible.txt"

          echo "Fetching existing distfile releases from ${DISTFILES_REPO}..."
          gh api --paginate "repos/${DISTFILES_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep -E '^moviebox-tui-[0-9]' |
            sort -V > "${WORKDIR}/existing-distfiles.txt" || true

          : > "${WORKDIR}/missing-tags.txt"

          while read -r TAG; do
            [[ -n "${TAG}" ]] || continue
            VER="${TAG#v}"
            if ! grep -qx "moviebox-tui-\({VER}" "\){WORKDIR}/existing-distfiles.txt"; then
              echo "\({TAG}" >> "\){WORKDIR}/missing-tags.txt"
            fi
          done < "${WORKDIR}/upstream-eligible.txt"

          MISSING_CSV=\((paste -sd, "\){WORKDIR}/missing-tags.txt" || true)
          echo "Target releases to process: ${MISSING_CSV}"
          echo "versions=\({MISSING_CSV}" >> "\){GITHUB_OUTPUT}"

      - name: Process and Publish Crate Distfiles
        if: steps.releases.outputs.versions != ''
        env:
          GH_TOKEN: ${{ secrets.DISTFILES_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="${RUNNER_TEMP}/moviebox-build"
          DISTDIR="${BASE_DIR}/distfiles"
          SOURCEDIR="${BASE_DIR}/sources"
          CONFDIR="${BASE_DIR}/config"

          mkdir -p "\({DISTDIR}" "\){SOURCEDIR}" "${CONFDIR}"

          # Dummy license mapping config to handle non-standard SPDX licenses gracefully
          echo '[spdx-to-ebuild]' > "${CONFDIR}/license-mapping.conf"

          IFS=',' read -ra TAGS <<< "${{ steps.releases.outputs.versions }}"

          for TAG in "${TAGS[@]}"; do
            [[ -n "${TAG}" ]] || continue
            VERSION="${TAG#v}"

            PACKAGE="moviebox-tui-${VERSION}"
            RELEASE_TAG="moviebox-tui-${VERSION}"
            SOURCE_ARCHIVE="\({SOURCEDIR}/\){PACKAGE}.tar.gz"
            CRATE_TARBALL="\({DISTDIR}/\){PACKAGE}-crates.tar.xz"
            EXTRACT_DIR="\({SOURCEDIR}/extract-\){VERSION}"

            echo "------------------------------------------------------------"
            echo "Processing: \({PACKAGE} (Tag:\){TAG})"
            echo "------------------------------------------------------------"

            rm -rf "\({EXTRACT_DIR}" "\){SOURCE_ARCHIVE}" "${CRATE_TARBALL}"
            mkdir -p "${EXTRACT_DIR}"

            echo "Downloading upstream source tarball..."
            curl -fL --retry 5 --retry-delay 2 \
              -o "${SOURCE_ARCHIVE}" \
              "https://github.com/\({UPSTREAM_REPO}/archive/refs/tags/\){TAG}.tar.gz"

            echo "Extracting archive..."
            tar -xzf "\({SOURCE_ARCHIVE}" -C "\){EXTRACT_DIR}" --strip-components=1

            if [[ ! -f "\({EXTRACT_DIR}/Cargo.toml" || ! -f "\){EXTRACT_DIR}/Cargo.lock" ]]; then
              echo "Error: Missing Cargo manifests in ${TAG}." >&2
              exit 1
            fi

            echo "Generating crate archive via pycargoebuild..."
            set +e
            pycargoebuild \
              -f \
              -w \
              -d "${DISTDIR}" \
              -l "${CONFDIR}/license-mapping.conf" \
              --crate-tarball-path "${CRATE_TARBALL}" \
              "${EXTRACT_DIR}"
            PYCARGO_STATUS=$?
            set -e

            if [[ ${PYCARGO_STATUS} -ne 0 ]]; then
              echo "Warning: pycargoebuild returned status ${PYCARGO_STATUS}."
            fi

            if [[ ! -s "${CRATE_TARBALL}" ]]; then
              echo "Error: Failed to generate crate archive ${CRATE_TARBALL}." >&2
              exit 1
            fi

            echo "Generated archive info:"
            ls -lh "${CRATE_TARBALL}"

            echo "Publishing release \({RELEASE_TAG} to\){DISTFILES_REPO}..."
            gh release create "\({RELEASE_TAG}" "\){CRATE_TARBALL}" \
              --repo "${DISTFILES_REPO}" \
              --title "MovieBox-Tui ${VERSION} crates" \
              --notes "Automated Gentoo cargo vendor archive for MovieBox-Tui v${VERSION}."

            echo "Successfully published: https://github.com/\({DISTFILES_REPO}/releases/tag/\){RELEASE_TAG}"

            # Workspace cleanup per iteration
            rm -rf "\({EXTRACT_DIR}" "\){SOURCE_ARCHIVE}"
          done

      - name: Status Report
        if: steps.releases.outputs.versions == ''
        shell: bash
        run: |
          echo "No missing distfiles detected. Repositories are synchronized."
