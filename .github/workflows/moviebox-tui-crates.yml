name: MovieBox-Tui Crate Distfiles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MovieBox-Tui version to process (example: 0.1.18). Leave empty to process all missing releases >= 0.1.18."
        required: false
        type: string

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: mesamirh/MovieBox-Tui
  DISTFILES_REPO: Err0rXG/err0rx-overlay-distfiles
  MIN_VERSION: "0.1.18"

jobs:
  crates:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ">=3.14"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install portage 'pycargoebuild>=0.17.1'

          echo "Python:"
          python --version

          echo "Portage:"
          python -c 'import portage; print(portage.VERSION)'

          echo "pycargoebuild:"
          pycargoebuild --help >/dev/null
          echo "pycargoebuild is available."

      - name: Determine releases to build
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WORKDIR="${RUNNER_TEMP}/work"
          mkdir -p "${WORKDIR}"

          INPUT_VERSION="${{ inputs.version }}"

          #
          # Manual version requested
          #
          if [[ -n "${INPUT_VERSION}" ]]; then
            REQUESTED_VERSION="${INPUT_VERSION}"

            if [[ "$(printf '%s\n' "${REQUESTED_VERSION}" "${MIN_VERSION}" | sort -V | head -n1)" != "${MIN_VERSION}" ]]; then
              echo "Requested version ${REQUESTED_VERSION} is below minimum ${MIN_VERSION}."
              exit 1
            fi

            echo "Manual version requested: ${REQUESTED_VERSION}"
            echo "versions=v${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          #
          # Get all upstream releases
          #
          echo "Minimum MovieBox-Tui version: ${MIN_VERSION}"
          echo "Checking upstream releases..."

          gh api --paginate \
            "repos/${UPSTREAM_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep '^v[0-9]' |
            sort -V > "${WORKDIR}/all-upstream-releases.txt"

          #
          # Keep only releases >= MIN_VERSION
          #
          MIN_TAG="v${MIN_VERSION}"

          awk -v min="${MIN_TAG}" '
            $0 == min { found=1 }
            found
          ' "${WORKDIR}/all-upstream-releases.txt" \
            > "${WORKDIR}/upstream-releases.txt"

          if [[ ! -s "${WORKDIR}/upstream-releases.txt" ]]; then
            echo "No upstream releases >= ${MIN_VERSION} found."
            echo "versions=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo
          echo "Upstream releases from ${MIN_TAG}:"
          cat "${WORKDIR}/upstream-releases.txt"

          #
          # Get releases already published in our distfiles repository
          #
          echo
          echo "Checking existing distfile releases..."

          gh api --paginate \
            "repos/${DISTFILES_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep '^moviebox-tui-[0-9]' |
            sort -V > "${WORKDIR}/existing-releases.txt" || true

          echo "Existing distfile releases:"
          cat "${WORKDIR}/existing-releases.txt" || true

          #
          # Find missing releases
          #
          : > "${WORKDIR}/missing-releases.txt"

          while read -r TAG; do
            [[ -n "${TAG}" ]] || continue

            VERSION="${TAG#v}"
            RELEASE_TAG="moviebox-tui-${VERSION}"

            if ! grep -Fxq "${RELEASE_TAG}" \
                "${WORKDIR}/existing-releases.txt"; then
              echo "${TAG}" >> "${WORKDIR}/missing-releases.txt"
            fi
          done < "${WORKDIR}/upstream-releases.txt"

          echo
          echo "Missing releases:"
          cat "${WORKDIR}/missing-releases.txt" || true

          VERSIONS="$(paste -sd, "${WORKDIR}/missing-releases.txt")"

          echo "versions=${VERSIONS}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish crate tarballs
        if: steps.releases.outputs.versions != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="${RUNNER_TEMP}/moviebox-tui"
          DISTDIR="${WORKDIR}/distfiles"
          SOURCEDIR="${WORKDIR}/sources"

          mkdir -p "${DISTDIR}" "${SOURCEDIR}"

          IFS=',' read -ra TAGS <<< "${{ steps.releases.outputs.versions }}"

          for TAG in "${TAGS[@]}"; do
            [[ -n "${TAG}" ]] || continue

            VERSION="${TAG#v}"

            PACKAGE="moviebox-tui-${VERSION}"
            RELEASE_TAG="moviebox-tui-${VERSION}"

            SOURCE_ARCHIVE="${SOURCEDIR}/${PACKAGE}.tar.gz"
            SOURCE_DIR="${SOURCEDIR}/MovieBox-Tui-${VERSION}"
            CRATE_TARBALL="${DISTDIR}/${PACKAGE}-crates.tar.xz"

            echo
            echo "============================================================"
            echo "MovieBox-Tui ${VERSION}"
            echo "============================================================"

            rm -rf "${SOURCE_DIR}"
            rm -f "${SOURCE_ARCHIVE}"
            rm -f "${CRATE_TARBALL}"

            echo "Downloading source..."

            curl -fL --retry 5 --retry-delay 2 \
              -o "${SOURCE_ARCHIVE}" \
              "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${TAG}.tar.gz"

            echo "Extracting source..."

            tar -xzf "${SOURCE_ARCHIVE}" \
              -C "${SOURCEDIR}"

            test -f "${SOURCE_DIR}/Cargo.toml"
            test -f "${SOURCE_DIR}/Cargo.lock"

            echo "Generating crate tarball..."

            PYCARGO_STATUS=0

            curl -fL --retry 5 --retry-delay 2 \
              -o "${RUNNER_TEMP}/license-mapping.conf" \
              "https://raw.githubusercontent.com/gentoo/gentoo/master/metadata/license-mapping.conf"

            pycargoebuild \
              -f \
              -w \
              -L \
              -d "${DISTDIR}" \
              -l "${RUNNER_TEMP}/license-mapping.conf" \
              --crate-tarball-path "${CRATE_TARBALL}" \
              "${SOURCE_DIR}/" || PYCARGO_STATUS=$?

            test -s "${CRATE_TARBALL}"

            echo "Crate tarball successfully generated:"
            ls -lh "${CRATE_TARBALL}"

            #
            # pycargoebuild 0.17.1 writes the crate tarball before
            # entering its license-processing stage. On the GitHub
            # runner there is no Gentoo repository/license mapping,
            # so that later stage can return non-zero.
            #
            if [[ ! -s "${CRATE_TARBALL}" ]]; then
              echo "ERROR: crate tarball was not generated."
              exit "${PYCARGO_STATUS}"
            fi

            if [[ "${PYCARGO_STATUS}" -ne 0 ]]; then
              echo
              echo "pycargoebuild exited with status ${PYCARGO_STATUS},"
              echo "but the crate tarball was successfully generated."
              echo "Continuing."
            fi

            echo
            echo "Crate tarball:"
            ls -lh "${CRATE_TARBALL}"

            echo
            echo "Publishing release ${RELEASE_TAG}..."

            if gh release view "${RELEASE_TAG}" \
                --repo "${DISTFILES_REPO}" >/dev/null 2>&1; then

              echo "Release already exists. Uploading asset..."

              gh release upload \
                "${RELEASE_TAG}" \
                "${CRATE_TARBALL}" \
                --repo "${DISTFILES_REPO}" \
                --clobber

            else

              gh release create \
                "${RELEASE_TAG}" \
                "${CRATE_TARBALL}" \
                --repo "${DISTFILES_REPO}" \
                --title "MovieBox-Tui ${VERSION} crates" \
                --notes "Cargo crate tarball for MovieBox-Tui ${VERSION}."

            fi

            echo
            echo "Published:"
            echo "https://github.com/${DISTFILES_REPO}/releases/tag/${RELEASE_TAG}"

          done

      - name: Nothing to do
        if: steps.releases.outputs.versions == ''
        shell: bash
        run: |
          echo "No missing MovieBox-Tui releases >= ${MIN_VERSION}."
