name: MovieBox-Tui Crate Distfiles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MovieBox-Tui version to process (example: 0.1.18). Leave empty to process all missing releases."
        required: false
        type: string

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: mesamirh/MovieBox-Tui
  DISTFILES_REPO: Err0rXG/err0rx-overlay-distfiles

jobs:
  crates:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ">=3.14"

      - name: Install pycargoebuild
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install portage 'pycargoebuild>=0.17.1'

          echo "Python:"
          python --version

          echo "Portage:"
          python -c 'import portage; print(portage.VERSION)'

          echo "pycargoebuild:"
          #pycargoebuild --version

      - name: Determine releases to build
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/work"

          MIN_VERSION="v0.1.18"
          INPUT_VERSION="${{ inputs.version }}"

          if [[ -n "${INPUT_VERSION}" ]]; then
            REQUESTED_TAG="v${INPUT_VERSION}"

            if [[ "${REQUESTED_TAG}" == "${MIN_VERSION}" ]] ||
               printf '%s\n' "${REQUESTED_TAG}" "${MIN_VERSION}" |
               sort -V |
               tail -n1 |
               grep -qx "${REQUESTED_TAG}"; then

              echo "Manual version requested: ${INPUT_VERSION}"
              echo "versions=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
              exit 0

            else
              echo "Requested version ${INPUT_VERSION} is below minimum ${MIN_VERSION}."
              exit 1
            fi
          fi

          echo "Minimum MovieBox-Tui version: ${MIN_VERSION}"
          echo
          echo "Checking upstream releases..."

          gh api --paginate \
            "repos/${UPSTREAM_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep '^v[0-9]' |
            sort -V > "${RUNNER_TEMP}/work/all-upstream-releases.txt"

          if ! grep -Fxq "${MIN_VERSION}" \
              "${RUNNER_TEMP}/work/all-upstream-releases.txt"; then
            echo "Minimum version ${MIN_VERSION} was not found upstream."
            exit 1
          fi

          awk -v min="${MIN_VERSION}" '
            $0 == min { found=1 }
            found
          ' "${RUNNER_TEMP}/work/all-upstream-releases.txt" \
            > "${RUNNER_TEMP}/work/upstream-releases.txt"

          echo "Upstream releases from ${MIN_VERSION}:"
          cat "${RUNNER_TEMP}/work/upstream-releases.txt"

          echo
          echo "Checking existing distfile releases..."

          gh api --paginate \
            "repos/${DISTFILES_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep '^moviebox-tui-[0-9]' |
            sort -V > "${RUNNER_TEMP}/work/existing-releases.txt" || true

          echo "Existing distfile releases:"
          cat "${RUNNER_TEMP}/work/existing-releases.txt" || true

          : > "${RUNNER_TEMP}/work/missing-releases.txt"

          while read -r TAG; do
            [[ -n "${TAG}" ]] || continue

            VERSION="${TAG#v}"

            if ! grep -qx "moviebox-tui-${VERSION}" \
                "${RUNNER_TEMP}/work/existing-releases.txt"; then
              echo "${TAG}" >> "${RUNNER_TEMP}/work/missing-releases.txt"
            fi
          done < "${RUNNER_TEMP}/work/upstream-releases.txt"

          echo
          echo "Missing releases:"
          cat "${RUNNER_TEMP}/work/missing-releases.txt" || true

          VERSIONS="$(paste -sd, \
            "${RUNNER_TEMP}/work/missing-releases.txt")"

          echo "versions=${VERSIONS}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish crate tarballs
        if: steps.releases.outputs.versions != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="${RUNNER_TEMP}/moviebox-tui"
          DISTDIR="${WORKDIR}/distfiles"
          SOURCEDIR="${WORKDIR}/sources"

          mkdir -p "${DISTDIR}" "${SOURCEDIR}"

          IFS=',' read -ra TAGS <<< "${{ steps.releases.outputs.versions }}"

          for TAG in "${TAGS[@]}"; do
            [[ -n "${TAG}" ]] || continue

            VERSION="${TAG#v}"

            PACKAGE="moviebox-tui-${VERSION}"
            RELEASE_TAG="moviebox-tui-${VERSION}"

            SOURCE_ARCHIVE="${SOURCEDIR}/${PACKAGE}.tar.gz"
            SOURCE_DIR="${SOURCEDIR}/MovieBox-Tui-${VERSION}"
            CRATE_TARBALL="${DISTDIR}/${PACKAGE}-crates.tar.xz"

            echo
            echo "============================================================"
            echo "MovieBox-Tui ${VERSION}"
            echo "============================================================"

            rm -rf "${SOURCE_DIR}"
            rm -f "${SOURCE_ARCHIVE}" "${CRATE_TARBALL}"

            echo "Downloading source..."

            curl -fL --retry 5 --retry-delay 2 \
              -o "${SOURCE_ARCHIVE}" \
              "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${TAG}.tar.gz"

            echo "Extracting source..."

            tar -xzf "${SOURCE_ARCHIVE}" \
              -C "${SOURCEDIR}"

            test -f "${SOURCE_DIR}/Cargo.toml"
            test -f "${SOURCE_DIR}/Cargo.lock"

            echo "Generating crate tarball..."

            printf '[spdx-to-ebuild]\n' \
              > "${RUNNER_TEMP}/empty-license-mapping.conf"

            pycargoebuild \
              -f \
              -w \
              -d "${DISTDIR}" \
              -l "${RUNNER_TEMP}/empty-license-mapping.conf" \
              --crate-tarball-path "${CRATE_TARBALL}" \
              "${SOURCE_DIR}/"

            #STATUS=$?

            #set -e

            #if [[ ${STATUS} -ne 0 ]]; then
             # echo "pycargoebuild exited with status ${STATUS}."

              #if [[ ! -s "${CRATE_TARBALL}" ]]; then
                #echo "Crate tarball was not generated."
                #exit "${STATUS}"
              #fi

              #echo "Crate tarball exists; ignoring license-processing failure."
            #fi

            test -s "${CRATE_TARBALL}"

            echo
            echo "Generated crate tarball:"
            ls -lh "${CRATE_TARBALL}"

            echo
            echo "Creating GitHub release: ${RELEASE_TAG}"

            gh release create \
              "${RELEASE_TAG}" \
              "${CRATE_TARBALL}" \
              --repo "${DISTFILES_REPO}" \
              --title "MovieBox-Tui ${VERSION} crates" \
              --notes "Cargo crate tarball for MovieBox-Tui ${VERSION}."

            echo
            echo "Published:"
            echo "https://github.com/${DISTFILES_REPO}/releases/tag/${RELEASE_TAG}"

          done

      - name: Nothing to do
        if: steps.releases.outputs.versions == ''
        shell: bash
        run: |
          echo "No missing MovieBox-Tui crate releases."
