name: Check Ghidra release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest Ghidra release
        id: ghidra
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(curl -fsSL \
            https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | jq -r '.tag_name')"

          VERSION="${TAG#Ghidra_}"
          VERSION="${VERSION%_build}"

          OUR_RELEASE="ghidra-${VERSION}"

          echo "Upstream tag  : ${TAG}"
          echo "Ghidra version: ${VERSION}"
          echo "Our release   : ${OUR_RELEASE}"

          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/Err0rXG/err0rx-overlay-distfiles/releases/tags/${OUR_RELEASE}")"

          echo "Our release HTTP status: ${STATUS}"

          if [[ "${STATUS}" == "200" ]]; then
            echo "Distfile release already exists."
            RELEASE_EXISTS="true"
          elif [[ "${STATUS}" == "404" ]]; then
            echo "Distfile release does not exist yet."
            RELEASE_EXISTS="false"
          else
            echo "Unexpected GitHub API status: ${STATUS}"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"

      - name: Download Ghidra source
        if: steps.ghidra.outputs.release_exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.ghidra.outputs.tag }}
          VERSION: ${{ steps.ghidra.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p source

          echo "Downloading Ghidra ${VERSION} (${TAG})..."

          curl -fL \
            "https://github.com/NationalSecurityAgency/ghidra/archive/refs/tags/${TAG}.tar.gz" \
            -o source/ghidra.tar.gz

          echo "Extracting source..."

          mkdir -p source/ghidra

          tar -xzf source/ghidra.tar.gz \
            --strip-components=1 \
            -C source/ghidra

      - name: Verify Ghidra source
        if: steps.ghidra.outputs.release_exists != 'true'
        id: source
        shell: bash
        env:
          TAG: ${{ steps.ghidra.outputs.tag }}
          VERSION: ${{ steps.ghidra.outputs.version }}
        run: |
          set -euo pipefail

          echo "Checking extracted source..."

          test -f source/ghidra/Ghidra/application.properties
          test -f source/ghidra/gradlew
          test -f source/ghidra/gradle/support/fetchDependencies.gradle

          SOURCE_VERSION="$(sed -n \
            's/^application.version=//p' \
            source/ghidra/Ghidra/application.properties)"

          GRADLE_MIN="$(sed -n \
            's/^application.gradle.min=//p' \
            source/ghidra/Ghidra/application.properties)"

          GRADLE_MAX="$(sed -n \
            's/^application.gradle.max=//p' \
            source/ghidra/Ghidra/application.properties)"

          JAVA_VERSION="$(sed -n \
            's/^application.java.compiler=//p' \
            source/ghidra/Ghidra/application.properties)"

          echo "Expected version: ${VERSION}"
          echo "Source version:   ${SOURCE_VERSION}"
          echo "Java compiler:    ${JAVA_VERSION}"
          echo "Gradle minimum:   ${GRADLE_MIN}"
          echo "Gradle maximum:   ${GRADLE_MAX:-none}"

          test "${SOURCE_VERSION}" = "${VERSION}"
          test -n "${JAVA_VERSION}"
          test -n "${GRADLE_MIN}"

          echo "java_version=${JAVA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gradle_min=${GRADLE_MIN}" >> "$GITHUB_OUTPUT"
          echo "gradle_max=${GRADLE_MAX}" >> "$GITHUB_OUTPUT"

          echo "Ghidra source verification passed."

      - name: Test Java & Gradle version output
        if: steps.ghidra.outputs.release_exists != 'true'
        run: |
          echo "Java Version output = '${{ steps.source.outputs.java_version }}'"
          echo "Gradle minimum output = '${{ steps.source.outputs.gradle_min }}'"
          echo "Gradle maximum output = '${{ steps.source.outputs.gradle_max }}'"

      - name: Set up Java
        if: steps.ghidra.outputs.release_exists != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "${{ steps.source.outputs.java_version }}"

      - name: Set up Gradle
        if: steps.ghidra.outputs.release_exists != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "${{ steps.source.outputs.gradle_min }}"

      - name: Verify build environment
        if: steps.ghidra.outputs.release_exists != 'true'
        working-directory: source/ghidra
        run: |
          set -euo pipefail

          echo "Java:"
          java --version

          echo
          echo "Gradle:"
          gradle --version

      - name: Fetch Ghidra dependencies
        if: steps.ghidra.outputs.release_exists != 'true'
        working-directory: source/ghidra
        run: |
          set -euo pipefail

          gradle -I gradle/support/fetchDependencies.gradle

      - name: Populate offline Gradle cache
        if: steps.ghidra.outputs.release_exists != 'true'
        working-directory: source/ghidra
        run: |
          set -euo pipefail

          gradle -g dependencies/gradle prepdev

      - name: Create dependency archive
        if: steps.ghidra.outputs.release_exists != 'true'
        working-directory: source/ghidra
        env:
          VERSION: ${{ steps.ghidra.outputs.version }}
        run: |
          set -euo pipefail

          ARCHIVE="../../ghidra-dependencies-${VERSION}.tar.gz"
          CHECKSUM="../../ghidra-dependencies-${VERSION}.tar.gz.sha256"

          tar -czf "${ARCHIVE}" dependencies

          sha256sum "${ARCHIVE}" > "${CHECKSUM}"

          ls -lh "${ARCHIVE}" "${CHECKSUM}"
          cat "${CHECKSUM}"

      - name: Publish release
        if: steps.ghidra.outputs.release_exists != 'true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ghidra.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "ghidra-${VERSION}" \
            --repo Err0rXG/err0rx-overlay-distfiles \
            --title "Ghidra ${VERSION} dependencies" \
            --notes "Auto-generated, offline-verified Gradle dependency bundle for Ghidra_${VERSION}_build" \
            "ghidra-dependencies-${VERSION}.tar.gz" \
            "ghidra-dependencies-${VERSION}.tar.gz.sha256"
