name: Check Ghidra release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest Ghidra release
        id: ghidra
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(curl -fsSL \
            https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | jq -r '.tag_name')"

          VERSION="${TAG#Ghidra_}"
          VERSION="${VERSION%_build}"

          OUR_RELEASE="ghidra-${VERSION}"

          echo "Upstream tag  : ${TAG}"
          echo "Ghidra version: ${VERSION}"
          echo "Our release   : ${OUR_RELEASE}"

          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/Err0rXG/err0rx-overlay-distfiles/releases/tags/${OUR_RELEASE}")"

          echo "Our release HTTP status: ${STATUS}"

          if [[ "${STATUS}" == "200" ]]; then
            echo "Distfile release already exists."
          elif [[ "${STATUS}" == "404" ]]; then
            echo "Distfile release does not exist yet."
          else
            echo "Unexpected GitHub API status: ${STATUS}"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Ghidra source
        shell: bash
        env:
          TAG: ${{ steps.ghidra.outputs.tag }}
          VERSION: ${{ steps.ghidra.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p source

          echo "Downloading Ghidra ${VERSION} (${TAG})..."

          curl -fL \
            "https://github.com/NationalSecurityAgency/ghidra/archive/refs/tags/${TAG}.tar.gz" \
            -o source/ghidra.tar.gz

          echo "Extracting source..."

          mkdir -p source/ghidra

          tar -xzf source/ghidra.tar.gz \
            --strip-components=1 \
            -C source/ghidra

      - name: Verify Ghidra source
        shell: bash
        env:
          TAG: ${{ steps.ghidra.outputs.tag }}
          VERSION: ${{ steps.ghidra.outputs.version }}
        run: |
          set -euo pipefail

          echo "Checking extracted source..."

          test -f source/ghidra/Ghidra/application.properties
          test -f source/ghidra/gradlew
          test -f source/ghidra/gradle/support/fetchDependencies.gradle

          SOURCE_VERSION="$(sed -n \
            's/^application.version=//p' \
            source/ghidra/Ghidra/application.properties)"

          echo "Expected version: ${VERSION}"
          echo "Source version:   ${SOURCE_VERSION}"

          test "${SOURCE_VERSION}" = "${VERSION}"

          echo "Ghidra source verification passed."

      - name: Show source contents
        run: |
          du -sh source/ghidra
          ls -la source/ghidra

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.5"

      - name: Verify build environment
        working-directory: source/ghidra
        run: |
          set -euo pipefail

          echo "Java:"
          java --version

          echo
          echo "Gradle:"
          gradle --version
