name: nmrs-gui Crate Distfiles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "nmrs-gui version to process (example: 2.0.0). Leave empty to process all missing releases >= 2.0.0."
        required: false
        type: string

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: freedesktop-rs/nmrs-gui
  DISTFILES_REPO: Err0rXG/err0rx-overlay-distfiles
  MIN_VERSION: "2.0.0"

jobs:
  crates:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ">=3.14"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install portage 'pycargoebuild>=0.17.1'

          echo "Python:"
          python --version

          echo "Portage:"
          python -c 'import portage; print(portage.VERSION)'

          echo "pycargoebuild:"
          pycargoebuild --help >/dev/null
          echo "pycargoebuild is available."

          echo "cargo:"
          cargo --version

      - name: Determine releases to build
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          WORKDIR="${RUNNER_TEMP}/work"
          mkdir -p "${WORKDIR}"

          #
          # Manual version requested
          #
          if [[ -n "${INPUT_VERSION}" ]]; then
            REQUESTED_VERSION="${INPUT_VERSION#v}"

            if [[ "$(printf '%s\n' "${REQUESTED_VERSION}" "${MIN_VERSION}" | sort -V | head -n1)" != "${MIN_VERSION}" ]]; then
              echo "Requested version ${REQUESTED_VERSION} is below minimum ${MIN_VERSION}."
              exit 1
            fi

            echo "Manual version requested: ${REQUESTED_VERSION}"
            echo "versions=v${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          #
          # Get all upstream tags. Only plain vX.Y.Z tags count: upstream also
          # has old nmrs-gui-vX.Y.Z and vX.Y.Z-beta tags, which are skipped.
          #
          echo "Minimum nmrs-gui version: ${MIN_VERSION}"
          echo "Checking upstream tags..."

          gh api --paginate \
            "repos/${UPSTREAM_REPO}/tags?per_page=100" \
            --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V > "${WORKDIR}/all-upstream-releases.txt" || true

          #
          # Keep only versions >= MIN_VERSION
          #
          : > "${WORKDIR}/upstream-releases.txt"

          while read -r TAG; do
            [[ -n "${TAG}" ]] || continue

            VERSION="${TAG#v}"

            if [[ "$(printf '%s\n' "${VERSION}" "${MIN_VERSION}" | sort -V | head -n1)" == "${MIN_VERSION}" ]]; then
              echo "${TAG}" >> "${WORKDIR}/upstream-releases.txt"
            fi
          done < "${WORKDIR}/all-upstream-releases.txt"

          if [[ ! -s "${WORKDIR}/upstream-releases.txt" ]]; then
            echo "No upstream releases >= ${MIN_VERSION} found."
            echo "versions=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo
          echo "Upstream releases >= ${MIN_VERSION}:"
          cat "${WORKDIR}/upstream-releases.txt"

          #
          # Get releases already published in our distfiles repository
          #
          echo
          echo "Checking existing distfile releases..."

          gh api --paginate \
            "repos/${DISTFILES_REPO}/releases?per_page=100" \
            --jq '.[].tag_name' |
            grep '^nmrs-gui-[0-9]' |
            sort -V > "${WORKDIR}/existing-releases.txt" || true

          echo "Existing distfile releases:"
          cat "${WORKDIR}/existing-releases.txt" || true

          #
          # Find missing releases
          #
          : > "${WORKDIR}/missing-releases.txt"

          while read -r TAG; do
            [[ -n "${TAG}" ]] || continue

            VERSION="${TAG#v}"
